[package]
name = "agy-top"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Security-hardened Multi-Account Quota & Refresh Timer TUI/CLI for Google Antigravity CLI (agy)."
license = "MIT"
readme = "README.md"
keywords = ["antigravity", "gemini", "quota", "tui", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agy-top"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
crossterm = "0.28.1"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
